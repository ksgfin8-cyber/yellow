<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEI — Mundo de Supervivencia v0.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GEI — Mundo de Supervivencia v0.1</h1>
        <div id="clock-panel" class="panel">
            <span id="clock-day">Día 1</span>
            <span id="clock-hour">00:00</span>
            <span id="clock-tick">tick 0</span>
            <button id="btn-toggle">Pausar</button>
            <button id="btn-step">Paso</button>
        </div>
    </header>

    <main>
        <section id="map-panel">
            <h2>Mapa</h2>
            <div id="map" class="map"></div>
        </section>

        <section id="zone-panel" class="panel">
            <h2>Zona seleccionada</h2>
            <div id="zone-info">Ninguna zona seleccionada.</div>
        </section>

        <section id="world-panel" class="panel">
            <h2>Estado del mundo</h2>
            <div id="world-info"></div>
        </section>

        <section id="events-panel" class="panel">
            <h2>Eventos recientes</h2>
            <ul id="events-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores Amarillas</title>
<style>
  :root { --bg-night: #05070f; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-night);
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { height: 10000px; }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
    perspective: 1400px;
    perspective-origin: 50% 60%;
  }

  /* SKY */
  #sky { position: absolute; inset: 0; z-index: 0; }
  .sky-layer { position: absolute; inset: 0; opacity: 0; will-change: opacity; }

  .sky-layer[data-phase="night"] {
    background: radial-gradient(140% 90% at 50% 20%, #101a33 0%, #0a1024 45%, #04060d 100%);
    opacity: 1;
  }
  .sky-layer[data-phase="dawn"] {
    background: linear-gradient(180deg, #141a36 0%, #262a55 25%, #584a72 50%, #9a6d6c 72%, #d99668 92%, #f0b478 100%);
  }
  .sky-layer[data-phase="day"] {
    background: linear-gradient(180deg, #4a7fb8 0%, #6ea4d2 30%, #a5c8e3 55%, #d5e2e8 75%, #f0e6b8 92%, #f8e8a8 100%);
  }
  .sky-layer[data-phase="sunset"] {
    background: linear-gradient(180deg, #2a3566 0%, #5a4a82 22%, #a45a72 46%, #e0846a 68%, #f2a25c 84%, #fbc97a 100%);
  }

  #stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 1; }
  .star { position: absolute; width: 1.6px; height: 1.6px; border-radius: 50%; background: #eaf0ff; opacity: 0.75; }
  .star.far { width: 1px; height: 1px; opacity: 0.45; }

  #sun {
    position: absolute; left: 50%; top: 78%;
    width: 46vmin; height: 46vmin;
    margin-left: -23vmin; margin-top: -23vmin;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 240, 190, 1.0) 0%,
      rgba(255, 215, 130, 0.75) 22%,
      rgba(255, 180, 95, 0.30) 48%,
      rgba(255, 160, 70, 0.0) 75%);
    filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* WORLD */
  #world {
    position: absolute; inset: 0; z-index: 3;
    transform-origin: 50% 100%;
    will-change: transform;
  }

  #horizon {
    position: absolute; left: -20%; right: -20%; top: 50%; height: 40vh;
    z-index: 3; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(255, 200, 120, 0.0) 0%,
      rgba(255, 200, 120, 0.0) 40%,
      rgba(255, 190, 110, 0.22) 58%,
      rgba(255, 180, 90, 0.45) 68%,
      rgba(255, 170, 80, 0.0) 88%);
    opacity: 0;
    will-change: opacity, transform;
  }

  #terrain {
    position: absolute; left: -20%; right: -20%; bottom: -20%; height: 90%;
    z-index: 4; transform-origin: 50% 100%;
    will-change: transform;
  }
  .terrain-layer { position: absolute; inset: 0; opacity: 0; will-change: opacity; }

  .terrain-layer[data-phase="soil-dark"] {
    background: linear-gradient(180deg,
      rgba(6, 8, 14, 0.0) 0%, rgba(6, 8, 14, 0.5) 20%,
      #07090e 40%, #0c0e14 70%, #14161c 100%);
    opacity: 1;
  }
  .terrain-layer[data-phase="soil-wet"] {
    background: linear-gradient(180deg,
      rgba(20, 24, 32, 0.0) 0%, rgba(24, 28, 36, 0.7) 22%,
      #1d222a 50%, #2a2f38 80%, #33383f 100%);
  }
  .terrain-layer[data-phase="grass"] {
    background: linear-gradient(180deg,
      rgba(34, 44, 32, 0.0) 0%, rgba(36, 46, 34, 0.65) 22%,
      #2a3b2a 50%, #3b5038 78%, #4c6442 100%);
  }
  .terrain-layer[data-phase="field"] {
    background: linear-gradient(180deg,
      rgba(140, 120, 50, 0.0) 0%, rgba(160, 140, 60, 0.55) 20%,
      #8a8038 45%, #b39a45 75%, #c9aa4d 100%);
  }
  .terrain-layer[data-phase="warm"] {
    background: linear-gradient(180deg,
      rgba(200, 140, 60, 0.0) 0%, rgba(220, 160, 70, 0.35) 22%,
      #c89638 50%, #e0a548 78%, #f0b958 100%);
  }

  /* CAMERA */
  #camera {
    position: absolute; inset: 0; z-index: 5;
    transform-origin: 50% 85%;
    will-change: transform;
  }
  .layer { position: absolute; inset: 0; pointer-events: none; will-change: transform, opacity, filter; }
  .layer[data-depth="far"]  { z-index: 1; }
  .layer[data-depth="mid"]  { z-index: 2; }
  .layer[data-depth="near"] { z-index: 3; }

  .flower {
    position: absolute;
    transform-origin: 50% 100%;
    will-change: transform;
    backface-visibility: hidden;
    overflow: visible;
  }

  /* PROTAGONISTA — usa la MISMA flor (flower-sym) + partes animables */
  #protagonist {
    position: absolute; left: 50%; bottom: 12%;
    width: 260px; height: 520px;
    transform: translate(-50%, 0);
    z-index: 6;
    overflow: visible;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
    opacity: 0;
  }

  /* CANVAS */
  #rain { position: absolute; inset: 0; z-index: 7; pointer-events: none; will-change: opacity; }
  #petals { position: absolute; inset: 0; z-index: 9; pointer-events: none; will-change: opacity; }

  /* VIGNETTE */
  #vignette {
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(130% 90% at 50% 50%,
      rgba(0,0,0,0) 38%, rgba(0,0,0,0.32) 76%, rgba(0,0,0,0.62) 100%);
    opacity: 1;
    will-change: opacity;
  }

  /* FINAL TEXT */
  #final-text {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    z-index: 10;
    max-width: 30ch;
    text-align: center;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.1rem, 2.4vw, 1.75rem);
    line-height: 1.55;
    letter-spacing: 0.012em;
    color: #fff6dd;
    text-shadow:
      0 2px 18px rgba(120, 60, 20, 0.6),
      0 0 44px rgba(255, 200, 120, 0.4);
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }
</style>
</head>
<body>

<div id="stage">

  <div id="sky">
    <div class="sky-layer" data-phase="night"></div>
    <div class="sky-layer" data-phase="dawn"></div>
    <div class="sky-layer" data-phase="day"></div>
    <div class="sky-layer" data-phase="sunset"></div>
  </div>

  <div id="stars"></div>
  <div id="sun"></div>

  <div id="world">
    <div id="horizon"></div>

    <div id="terrain">
      <div class="terrain-layer" data-phase="soil-dark"></div>
      <div class="terrain-layer" data-phase="soil-wet"></div>
      <div class="terrain-layer" data-phase="grass"></div>
      <div class="terrain-layer" data-phase="field"></div>
      <div class="terrain-layer" data-phase="warm"></div>
    </div>

    <div id="camera">
      <div class="layer" data-depth="far"></div>
      <div class="layer" data-depth="mid"></div>
      <div class="layer" data-depth="near"></div>
    </div>

    <!--
      PROTAGONISTA
      Construida con los MISMOS símbolos que el campo.
      El crecimiento se logra revelando cada parte con opacidad
      y con stroke-dashoffset sobre el tallo.
      Los pétalos NO se crean con <use>+transform CSS:
      vienen ya completos dentro de #flower-sym, y solo se
      escala el grupo #bloom para la apertura.
    -->
    <svg id="protagonist" viewBox="0 0 100 200" preserveAspectRatio="xMidYMax meet">
      <!-- semilla -->
      <ellipse id="seed" cx="50" cy="196" rx="3.2" ry="2" fill="#241609"/>

      <!-- tallo (idéntico al de la flor completa, para poder animar dashoffset) -->
      <path id="stem" d="M50 200 C50 178 49.4 150 50 106"
            stroke="#3f7a2f" stroke-width="2.8"
            fill="none" stroke-linecap="round"/>

      <!-- hojas -->
      <path id="leafL" d="M50 160 C36 158 24 148 22 136 C36 136 48 146 50 156 Z" fill="#4a8438"/>
      <path id="leafR" d="M50 138 C64 136 76 126 78 114 C64 114 52 124 50 134 Z" fill="#548e3e"/>

      <!-- capullo (revelado durante la fase de botón) -->
      <g id="bud" transform="translate(50 100)" opacity="0">
        <use href="#bud-sym" xlink:href="#bud-sym"
             x="-50" y="-100" width="100" height="200"
             fill="#d4a628"/>
      </g>

      <!-- flor completa (usa #flower-sym, misma que el campo) -->
      <g id="bloom" transform="translate(50 100)" opacity="0">
        <use href="#flower-sym" xlink:href="#flower-sym"
             x="-50" y="-100" width="100" height="200"/>
      </g>
    </svg>
  </div>

  <canvas id="rain"></canvas>
  <div id="vignette"></div>
  <canvas id="petals"></canvas>

  <div id="final-text">A veces una flor no necesita una razón complicada para existir.</div>

</div>

<!-- =========================================================
     ÚNICA DEFINICIÓN DE FLOR
     Todo el proyecto (protagonista + campo far/mid/near)
     usa estos símbolos. No hay segunda implementación.

     - petal-sym: pétalo orgánico, nace en (0,0), crece hacia -Y.
       viewBox holgado, sin recortes.
     - flower-sym: 8 pétalos rotados 45° alrededor de (0,0) del
       grupo interno. El núcleo va ENCIMA. Tallo y hojas alineados
       con la misma anatomía.
     - bud-sym: misma flor con pétalos cerrados (escala reducida).
     ========================================================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="petal-sym" viewBox="-11 -25 22 26" preserveAspectRatio="xMidYMid meet">
      <path d="M0 0
               C -4.5 -1.5, -8.5 -6.5, -8.5 -13
               C -8.5 -19, -4.5 -24, 0 -24
               C 4.5 -24, 8.5 -19, 8.5 -13
               C 8.5 -6.5, 4.5 -1.5, 0 0 Z"
            fill="currentColor"/>
      <path d="M0 -3 L0 -21"
            stroke="rgba(255,255,255,0.32)"
            stroke-width="0.5"
            fill="none"
            stroke-linecap="round"/>
    </symbol>

    <symbol id="flower-sym" viewBox="0 0 100 200" preserveAspectRatio="xMidYMax meet">
      <path d="M50 200 C50 178 49.4 150 50 106"
            stroke="#3f7a2f" stroke-width="2.8"
            fill="none" stroke-linecap="round"/>
      <path d="M50 160 C36 158 24 148 22 136 C36 136 48 146 50 156 Z" fill="#4a8438"/>
      <path d="M50 138 C64 136 76 126 78 114 C64 114 52 124 50 134 Z" fill="#548e3e"/>
      <g transform="translate(50 100)">
        <g fill="#f4c400">
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(0)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(45)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(90)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(135)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(180)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(225)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(270)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(315)"/>
        </g>
        <circle r="5.6" fill="#7a4d00"/>
        <circle r="3.4" fill="#9a6410"/>
      </g>
    </symbol>

    <symbol id="bud-sym" viewBox="0 0 100 200" preserveAspectRatio="xMidYMax meet">
      <path d="M50 200 C50 178 49.4 150 50 106"
            stroke="#3f7a2f" stroke-width="2.8"
            fill="none" stroke-linecap="round"/>
      <path d="M50 160 C36 158 24 148 22 136 C36 136 48 146 50 156 Z" fill="#4a8438"/>
      <path d="M50 138 C64 136 76 126 78 114 C64 114 52 124 50 134 Z" fill="#548e3e"/>
      <g transform="translate(50 100)">
        <g fill="#d4a628">
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(0) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(45) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(90) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(135) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(180) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(225) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(270) scale(0.7,0.85)"/>
          <use href="#petal-sym" xlink:href="#petal-sym" transform="rotate(315) scale(0.7,0.85)"/>
        </g>
        <circle r="4.6" fill="#7a4d00"/>
      </g>
    </symbol>
  </defs>
</svg>

<script>
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */
const isMobile = matchMedia('(max-width: 720px)').matches;

const CONFIG = {
  scrollHeight: 10000,
  smoothing: 0.09,
  seed: 12345,

  flowersFar:  isMobile ?  70 : 120,
  flowersMid:  isMobile ?  40 :  70,
  flowersNear: isMobile ?  14 :  24,

  petalsFar:   isMobile ?  18 :  34,
  petalsMid:   isMobile ?  10 :  18,
  petalsNear:  isMobile ?   5 :  10,

  rainCount:   isMobile ? 260 : 460,

  petalPalette: [
    '#f6c519', '#f0b31c', '#e8a233', '#f5cf55', '#e69a3e'
  ],

  phases: {
    gazeDownStart: 0.14,
    gazeDownEnd:   0.60,
    horizonStart:  0.26,
    horizonEnd:    0.48,
    rainFadeStart: 0.16,
    rainFadeEnd:   0.42,
    birthStart:    0.46,
    birthEnd:      0.78,
    dawnStart:     0.30,
    dawnEnd:       0.58,
    dayStart:      0.58,
    dayEnd:        0.74,
    sunsetStart:   0.74,
    sunsetEnd:     0.90,
    fieldStart:    0.60,
    fieldEnd:      0.90,
    finalTextStart: 0.90,
    finalTextEnd:   0.99,
    petalsStart:   0.50
  }
};

/* =========================================================
   HELPERS
   ========================================================= */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const range = (p, a, b) => clamp01((p - a) / (b - a));
const lerp  = (a, b, t) => a + (b - a) * t;

const smooth    = t => t * t * (3 - 2 * t);
const easeOut   = t => 1 - Math.pow(1 - t, 3);
const easeIn    = t => t * t * t;
const easeInOut = t => t < 0.5
  ? 4 * t * t * t
  : 1 - Math.pow(-2 * t + 2, 3) / 2;

function makeRandom(seed) {
  let s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================
   PROGRESS
   ========================================================= */
const scrollState = { raw: 0, smooth: 0 };

function readScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const y = window.scrollY || window.pageYOffset || 0;
  scrollState.raw = max > 0 ? clamp01(y / max) : 0;
}

window.addEventListener('scroll', readScroll, { passive: true });
window.addEventListener('resize', readScroll, { passive: true });
readScroll();

/* =========================================================
   DOM
   ========================================================= */
const stage       = document.getElementById('stage');
const worldEl     = document.getElementById('world');
const cameraEl    = document.getElementById('camera');
const horizonEl   = document.getElementById('horizon');
const terrainEl   = document.getElementById('terrain');
const skyEls      = Array.from(document.querySelectorAll('.sky-layer'));
const terrainEls  = Array.from(document.querySelectorAll('.terrain-layer'));
const sunEl       = document.getElementById('sun');
const starsEl     = document.getElementById('stars');
const vignetteEl  = document.getElementById('vignette');
const finalTextEl = document.getElementById('final-text');

const layers = {
  far:  document.querySelector('.layer[data-depth="far"]'),
  mid:  document.querySelector('.layer[data-depth="mid"]'),
  near: document.querySelector('.layer[data-depth="near"]')
};

const protagonist = document.getElementById('protagonist');
const seedEl      = document.getElementById('seed');
const stemEl      = document.getElementById('stem');
const leafLEl     = document.getElementById('leafL');
const leafREl     = document.getElementById('leafR');
const budEl       = document.getElementById('bud');
const bloomEl     = document.getElementById('bloom');

/* =========================================================
   STARS
   ========================================================= */
(function buildStars() {
  const rnd = makeRandom(CONFIG.seed ^ 0x9E3779B9);
  const frag = document.createDocumentFragment();
  const count = isMobile ? 90 : 150;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const isFar = rnd() < 0.55;
    s.className = 'star' + (isFar ? ' far' : '');
    s.style.left = (rnd() * 100).toFixed(2) + '%';
    s.style.top  = (rnd() * 55).toFixed(2) + '%';
    frag.appendChild(s);
  }
  starsEl.appendChild(frag);
})();

/* =========================================================
   SKY
   ========================================================= */
function updateSky(p) {
  const cfg = CONFIG.phases;

  const night  = 1 - smooth(range(p, cfg.dawnStart, cfg.dawnEnd));
  const dawn   = smooth(range(p, cfg.dawnStart, cfg.dawnEnd)) *
                 (1 - smooth(range(p, cfg.dayStart, cfg.dayEnd)));
  const day    = smooth(range(p, cfg.dayStart, cfg.dayEnd)) *
                 (1 - smooth(range(p, cfg.sunsetStart, cfg.sunsetEnd)));
  const sunset = smooth(range(p, cfg.sunsetStart, cfg.sunsetEnd));

  skyEls[0].style.opacity = night;
  skyEls[1].style.opacity = dawn;
  skyEls[2].style.opacity = day;
  skyEls[3].style.opacity = sunset;

  const starFade = 1 - smooth(range(p, cfg.dawnStart, cfg.dawnStart + 0.14));
  starsEl.style.opacity = starFade;

  const sunIn  = smooth(range(p, cfg.dawnStart + 0.08, cfg.dawnEnd + 0.05));
  const sunOut = smooth(range(p, cfg.sunsetStart + 0.04, cfg.sunsetEnd));
  sunEl.style.opacity = sunIn * (1 - sunOut * 0.4) * 0.95;
  sunEl.style.top = lerp(78, 62, smooth(range(p, cfg.dawnStart, cfg.sunsetEnd))) + '%';

  const vig = 1 - smooth(range(p, cfg.dawnStart, cfg.dayEnd)) * 0.7;
  vignetteEl.style.opacity = vig;

  const ft = smooth(range(p, cfg.finalTextStart, cfg.finalTextEnd));
  finalTextEl.style.opacity = ft * 0.95;
  finalTextEl.style.transform =
    'translate(-50%, calc(-50% + ' + lerp(8, 0, ft) + 'px))';
}

/* =========================================================
   MIRADA
   ========================================================= */
function gazeDown(p) {
  const cfg = CONFIG.phases;
  const t = range(p, cfg.gazeDownStart, cfg.gazeDownEnd);
  const firstHalf  = smooth(Math.min(1, t / 0.55)) * 0.35;
  const secondHalf = easeInOut(Math.max(0, (t - 0.55) / 0.45)) * 0.65;
  return firstHalf + secondHalf;
}

function updateWorldOrientation(p) {
  const g = gazeDown(p);
  const rotX = lerp(-42, 0, g);
  const ty   = lerp(28, 0, g);
  worldEl.style.transform = 'translate3d(0, ' + ty + 'vh, 0) rotateX(' + rotX + 'deg)';
}

/* =========================================================
   HORIZON
   ========================================================= */
function updateHorizon(p) {
  const cfg = CONFIG.phases;
  const t = smooth(range(p, cfg.horizonStart, cfg.horizonEnd));
  horizonEl.style.opacity = t * 0.85;
  const lift = smooth(range(p, cfg.fieldStart, 0.88)) * -6;
  horizonEl.style.transform = 'translateY(' + lift + 'vh)';
}

/* =========================================================
   TERRAIN
   ========================================================= */
function updateTerrain(p) {
  const cfg = CONFIG.phases;
  const visible = smooth(range(p, cfg.horizonEnd - 0.05, cfg.horizonEnd + 0.10));

  const soilWet = smooth(range(p, 0.42, 0.58));
  const grass   = smooth(range(p, 0.52, 0.70));
  const field   = smooth(range(p, cfg.fieldStart, cfg.fieldEnd));
  const warm    = smooth(range(p, cfg.sunsetStart, cfg.sunsetEnd));

  terrainEls[0].style.opacity = (1 - soilWet * 0.85) * visible;
  terrainEls[1].style.opacity = soilWet * (1 - grass) * visible;
  terrainEls[2].style.opacity = grass * (1 - field) * visible;
  terrainEls[3].style.opacity = field * (1 - warm * 0.85) * visible;
  terrainEls[4].style.opacity = field * warm * visible;

  const lift = smooth(range(p, cfg.fieldStart, 0.88));
  terrainEl.style.transform = 'translateY(' + lerp(0, -3, lift) + '%)';
}

/* =========================================================
   CAMERA
   Curva final más contenida: NO se aleja tanto.
   El tramo 0.80–1.00 apenas cambia la escala, así el campo
   respira y las flores conservan presencia.
   ========================================================= */
function cameraScale(p) {
  const a = 2.10;   // noche, muy cerca del suelo
  const b = 2.05;   // comienzo de la retirada
  const c = 1.85;   // se insinúa el horizonte
  const d = 1.15;   // ya se ve el suelo, aparece la protagonista
  const e = 0.90;   // el campo se revela
  const f = 0.82;   // estado final: amplio pero con flores presentes

  if (p < 0.26) return lerp(a, b, smooth(range(p, 0.00, 0.26)));
  if (p < 0.42) return lerp(b, c, easeInOut(range(p, 0.26, 0.42)));
  if (p < 0.60) return lerp(c, d, easeInOut(range(p, 0.42, 0.60)));
  if (p < 0.80) return lerp(d, e, easeOut(range(p, 0.60, 0.80)));
  if (p < 0.92) return lerp(e, f, smooth(range(p, 0.80, 0.92)));
  return f;
}

function cameraY(p) {
  /* Sube menos al final para que el campo no se vaya hacia arriba */
  const start = 36;
  const end   = -4;
  return lerp(start, end, easeInOut(clamp01(p)));
}

function cameraTranslateX(p) {
  return Math.sin(p * Math.PI * 0.9) * -1.0;
}

/* =========================================================
   PROTAGONISTA — crecimiento
   La flor usa #flower-sym directamente.
   La apertura se hace escalando #bloom y desvaneciendo #bud.
   No hay <use> con CSS transform. Toda la geometría vive
   dentro del símbolo compartido.
   ========================================================= */
const stemLen = stemEl.getTotalLength();
stemEl.style.strokeDasharray  = stemLen;
stemEl.style.strokeDashoffset = stemLen;

leafLEl.style.transformOrigin = '50px 160px';
leafREl.style.transformOrigin = '50px 138px';
budEl.style.transformOrigin   = '50px 100px';
bloomEl.style.transformOrigin = '50px 100px';

function updatePlant(p, t) {
  const cfg = CONFIG.phases;
  const appear = smooth(range(p, cfg.horizonEnd - 0.02, cfg.horizonEnd + 0.10));
  protagonist.style.opacity = appear;

  const birth = range(p, cfg.birthStart, cfg.birthEnd);

  const seedFade  = 1 - smooth(range(birth, 0.00, 0.10));
  const stemGrow  = smooth(range(birth, 0.05, 0.38));
  const leafLGrow = smooth(range(birth, 0.28, 0.55));
  const leafRGrow = smooth(range(birth, 0.36, 0.62));
  const budGrow   = smooth(range(birth, 0.52, 0.75));
  const bloomOpen = smooth(range(birth, 0.72, 1.00));

  seedEl.style.opacity = seedFade;
  stemEl.style.strokeDashoffset = stemLen * (1 - stemGrow);
  leafLEl.style.transform = 'scale(' + leafLGrow + ')';
  leafREl.style.transform = 'scale(' + leafRGrow + ')';

  /* Capullo: emerge, crece y se desvanece al abrir la flor */
  budEl.style.opacity = budGrow * (1 - bloomOpen);
  budEl.style.transform =
    'translate(50px 100px) scale(' + (0.55 + 0.45 * budGrow) + ')';

  /* Flor completa: aparece y crece con easing orgánico.
     La geometría interna (8 pétalos a 45°) viene ya correcta
     dentro de #flower-sym. Aquí solo animamos la escala global. */
  const openEase = easeOut(bloomOpen);
  const bloomScale = 0.55 + 0.55 * openEase;
  bloomEl.style.opacity = bloomOpen;
  bloomEl.style.transform =
    'translate(50px 100px) scale(' + bloomScale + ')';

  /* Viento sutil sobre la protagonista */
  const strength = smooth(range(p, 0.55, 0.78)) * (1 - bloomOpen * 0.35);
  const sway = Math.sin(t * 0.00085) * 1.0 +
               Math.sin(t * 0.00141 + 1.7) * 0.55;
  const rot = sway * strength;
  const tx  = Math.sin(t * 0.00062 + 0.4) * 1.4 * strength;
  protagonist.style.transform =
    'translate(calc(-50% + ' + tx + 'px), 0) rotate(' + rot + 'deg)';
  protagonist.style.transformOrigin = '50% 100%';
}

/* =========================================================
   CAMPO — determinista, con composición en clusters
   Todas las flores usan #flower-sym / #bud-sym (misma anatomía).
   ========================================================= */
const rnd = makeRandom(CONFIG.seed);

const DEPTHS = {
  far:  { scaleMin: 0.06, scaleMax: 0.14, yMin: 0.60, yMax: 0.74, blurMax: 2.2, alphaMin: 0.42, alphaMax: 0.72, count: CONFIG.flowersFar  },
  mid:  { scaleMin: 0.20, scaleMax: 0.42, yMin: 0.68, yMax: 0.88, blurMax: 0.7, alphaMin: 0.68, alphaMax: 0.95, count: CONFIG.flowersMid  },
  near: { scaleMin: 0.58, scaleMax: 1.10, yMin: 0.82, yMax: 1.08, blurMax: 0.0, alphaMin: 0.92, alphaMax: 1.00, count: CONFIG.flowersNear }
};

const flowers = [];

function buildField() {
  for (const key of ['far', 'mid', 'near']) {
    const cfg = DEPTHS[key];
    const container = layers[key];

    const focusCount = key === 'far' ? 7 : key === 'mid' ? 5 : 4;
    const focuses = [];
    for (let i = 0; i < focusCount; i++) {
      focuses.push({
        x: rnd(),
        y: cfg.yMin + rnd() * (cfg.yMax - cfg.yMin),
        r: 0.05 + rnd() * 0.14
      });
    }

    for (let i = 0; i < cfg.count; i++) {
      let x, y;
      if (rnd() < 0.7) {
        const f = focuses[(rnd() * focuses.length) | 0];
        const a = rnd() * Math.PI * 2;
        const r = Math.sqrt(rnd()) * f.r;
        x = f.x + Math.cos(a) * r;
        y = f.y + Math.sin(a) * r * 0.4;
      } else {
        x = rnd();
        y = cfg.yMin + rnd() * (cfg.yMax - cfg.yMin);
      }
      x = clamp01(x);
      y = clamp01(y);

      const scale = cfg.scaleMin + rnd() * (cfg.scaleMax - cfg.scaleMin);
      const tilt  = (rnd() - 0.5) * 18;
      const phase = rnd() * Math.PI * 2;
      const speed = 0.35 + rnd() * 0.55;
      const amp   = 0.4 + rnd() * 1.1;
      const alpha = cfg.alphaMin + rnd() * (cfg.alphaMax - cfg.alphaMin);
      const useBud = rnd() < 0.12;

      const hue = rnd();
      let tint = '#f4c400';
      if (hue < 0.15) tint = '#eeb61c';
      else if (hue < 0.30) tint = '#f6cf3a';
      else if (hue < 0.45) tint = '#f0b81e';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'flower');
      svg.setAttribute('viewBox', '0 0 100 200');
      svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
      svg.style.position = 'absolute';
      svg.style.left = (x * 100) + '%';
      svg.style.top  = (y * 100) + '%';
      svg.style.width  = (140 * scale) + 'px';
      svg.style.height = (280 * scale) + 'px';
      svg.style.transform = 'translate(-50%, -100%) rotate(' + tilt + 'deg)';
      svg.style.opacity = 0;
      if (cfg.blurMax > 0) {
        svg.style.filter = 'blur(' + (rnd() * cfg.blurMax).toFixed(2) + 'px)';
      }
      /* Tinte aplicado como color del contenedor; el pétalo lo recibe
         por currentColor. Además, forzamos fill en el <use>. */
      svg.style.color = tint;

      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', useBud ? '#bud-sym' : '#flower-sym');
      use.setAttribute('href', useBud ? '#bud-sym' : '#flower-sym');
      use.setAttribute('fill', tint);
      svg.appendChild(use);

      container.appendChild(svg);

      flowers.push({
        el: svg,
        layer: key,
        tilt,
        phase,
        speed,
        amp,
        alpha,
        depthFactor: key === 'near' ? 1 : key === 'mid' ? 0.55 : 0.22
      });
    }
  }
}

buildField();

function fieldVisibility(p, layerKey) {
  const cfg = CONFIG.phases;
  const offset =
    layerKey === 'far'  ? -0.04 :
    layerKey === 'mid'  ? +0.06 :
                          +0.16;
  const start = cfg.fieldStart + offset;
  return smooth(range(p, start, start + 0.22));
}

/* =========================================================
   LLUVIA
   ========================================================= */
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
let rainDrops = [];
let rainW = 0, rainH = 0, rainDPR = 1;

function resizeRain() {
  rainDPR = Math.min(window.devicePixelRatio || 1, 2);
  rainW = stage.clientWidth;
  rainH = stage.clientHeight;
  rainCanvas.width  = Math.floor(rainW * rainDPR);
  rainCanvas.height = Math.floor(rainH * rainDPR);
  rainCanvas.style.width  = rainW + 'px';
  rainCanvas.style.height = rainH + 'px';
  rctx.setTransform(rainDPR, 0, 0, rainDPR, 0, 0);
}

function buildRain() {
  const MAX = CONFIG.rainCount;
  rainDrops = new Array(MAX);
  for (let i = 0; i < MAX; i++) {
    const depth = rnd();
    const dir = (rnd() - 0.5) * 0.06;
    rainDrops[i] = {
      x: rnd(), y: rnd(), depth, dir,
      len: 6 + depth * 26,
      speed: 0.55 + depth * 1.7,
      alpha: 0.10 + depth * 0.60,
      bright: rnd() < 0.14
    };
  }
}

function rainIntensity(p) {
  const cfg = CONFIG.phases;
  if (p <= cfg.rainFadeStart) return 1.0;
  if (p >= cfg.rainFadeEnd)   return 0.0;
  const t = range(p, cfg.rainFadeStart, cfg.rainFadeEnd);
  return (1 - smooth(t)) * (1 - easeIn(t) * 0.4);
}

function updateRain(dt, p) {
  const intensity = rainIntensity(p);
  rainCanvas.style.opacity = intensity;

  if (intensity <= 0.01) {
    rctx.clearRect(0, 0, rainW, rainH);
    return;
  }
  rctx.clearRect(0, 0, rainW, rainH);

  const dawn = smooth(range(p, CONFIG.phases.dawnStart, CONFIG.phases.dawnEnd));
  const r = Math.round(lerp(180, 220, dawn));
  const g = Math.round(lerp(200, 225, dawn));
  const b = Math.round(lerp(235, 240, dawn));

  const dtSec = dt / 1000;
  for (let i = 0; i < rainDrops.length; i++) {
    const d = rainDrops[i];
    d.y += d.speed * dtSec * (0.8 + intensity * 1.4);
    if (d.y > 1.15) { d.y = -0.15; d.x = rnd(); }
    d.x += d.dir * dtSec * (0.5 + d.depth);

    const px = d.x * rainW;
    const py = d.y * rainH;
    const len = d.len * (0.55 + intensity * 0.75);
    const alpha = Math.min(d.alpha * intensity * (d.bright ? 1.4 : 1.0), 0.85);

    rctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    rctx.lineWidth = 0.4 + d.depth * 1.3;
    rctx.beginPath();
    rctx.moveTo(px, py);
    rctx.lineTo(px + d.dir * 40, py + len);
    rctx.stroke();
  }
}

/* =========================================================
   PÉTALOS FLOTANTES — sprite derivado del mismo pétalo
   ========================================================= */
const petalsCanvas = document.getElementById('petals');
const pctx = petalsCanvas.getContext('2d');
let petalW = 0, petalH = 0, petalDPR = 1;
let floatPetals = [];

function resizePetals() {
  petalDPR = Math.min(window.devicePixelRatio || 1, 2);
  petalW = stage.clientWidth;
  petalH = stage.clientHeight;
  petalsCanvas.width  = Math.floor(petalW * petalDPR);
  petalsCanvas.height = Math.floor(petalH * petalDPR);
  petalsCanvas.style.width  = petalW + 'px';
  petalsCanvas.style.height = petalH + 'px';
  pctx.setTransform(petalDPR, 0, 0, petalDPR, 0, 0);
}

/* Misma silueta que #petal-sym, dibujada en canvas */
function makePetalSprite(color) {
  const c = document.createElement('canvas');
  const s = 128;
  c.width = s;
  c.height = s;
  const g = c.getContext('2d');
  const cx = s / 2;
  const cy = s / 2;
  const sx = s / 26;
  const sy = s / 26;
  g.save();
  g.translate(cx, cy + s * 0.30);
  g.scale(sx, sy);
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(-4.5, -1.5, -8.5, -6.5, -8.5, -13);
  g.bezierCurveTo(-8.5, -19, -4.5, -24, 0, -24);
  g.bezierCurveTo(4.5, -24, 8.5, -19, 8.5, -13);
  g.bezierCurveTo(8.5, -6.5, 4.5, -1.5, 0, 0);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.30)';
  g.lineWidth = 0.5;
  g.beginPath();
  g.moveTo(0, -3);
  g.lineTo(0, -21);
  g.stroke();
  g.restore();
  return c;
}

const PETAL_SPRITES = CONFIG.petalPalette.map(c => makePetalSprite(c));

function buildPetals() {
  const total = CONFIG.petalsFar + CONFIG.petalsMid + CONFIG.petalsNear;
  floatPetals = new Array(total);

  for (let i = 0; i < total; i++) {
    let depth;
    if (i < CONFIG.petalsFar)       depth = 0.15 + rnd() * 0.15;
    else if (i < CONFIG.petalsFar + CONFIG.petalsMid) depth = 0.45 + rnd() * 0.20;
    else                            depth = 0.75 + rnd() * 0.25;

    const sprite = PETAL_SPRITES[(rnd() * PETAL_SPRITES.length) | 0];

    floatPetals[i] = {
      depth,
      x: rnd(),
      y: rnd(),
      size: lerp(14, 52, depth) * (0.75 + rnd() * 0.55),
      vx: lerp(0.006, 0.018, depth),
      vy: lerp(0.004, 0.009, depth),
      rot: rnd() * Math.PI * 2,
      rotSpd: (rnd() - 0.5) * 0.0008,
      fx: 0.25 + rnd() * 0.55,
      fy: 0.20 + rnd() * 0.65,
      phase: rnd() * Math.PI * 2,
      liftAmp: 0.5 + rnd() * 1.2,
      liftFreq: 0.15 + rnd() * 0.35,
      sprite,
      alpha: lerp(0.35, 0.95, depth)
    };
  }
}

function petalDensity(p) {
  const appear = smooth(range(p, CONFIG.phases.petalsStart, CONFIG.phases.petalsStart + 0.20));
  const calm   = 1 - smooth(range(p, 0.94, 1.00)) * 0.45;
  return appear * calm;
}

function wind(t) {
  return (
    0.55 * Math.sin(t * 0.00037) +
    0.35 * Math.sin(t * 0.00091 + 1.7) +
    0.20 * Math.sin(t * 0.00213 + 4.1)
  );
}

function updatePetals(dt, t, p) {
  const density = petalDensity(p);
  petalsCanvas.style.opacity = density;

  if (density <= 0.01) {
    pctx.clearRect(0, 0, petalW, petalH);
    return;
  }
  pctx.clearRect(0, 0, petalW, petalH);

  const dtSec = dt / 1000;
  const w = wind(t);
  const time = t * 0.001;
  const camS = cameraScale(p);

  for (let i = 0; i < floatPetals.length; i++) {
    const pt = floatPetals[i];

    const oscX = Math.sin(time * pt.fx + pt.phase) * 0.0022;
    const oscY = Math.cos(time * pt.fy + pt.phase) * 0.0015;
    const lift = Math.sin(time * pt.liftFreq + pt.phase * 1.7) * pt.liftAmp * 0.0009;

    pt.x += (pt.vx + w * 0.0011 * pt.depth + oscX) * dtSec;
    pt.y += (pt.vy + oscY - lift) * dtSec;
    pt.rot += pt.rotSpd * dtSec * 60;

    if (pt.x > 1.15) { pt.x = -0.15; pt.y = rnd(); }
    if (pt.x < -0.15) { pt.x = 1.15; pt.y = rnd(); }
    if (pt.y > 1.15) { pt.y = -0.15; pt.x = rnd(); }

    const px = pt.x * petalW;
    const py = pt.y * petalH;
    const layerPush = pt.depth * (1 - camS) * 22;
    const finalY = py + layerPush;

    const size = pt.size * (0.85 + 0.35 * pt.depth);

    pctx.save();
    pctx.globalAlpha = pt.alpha * density;
    pctx.translate(px, finalY);
    pctx.rotate(pt.rot);
    pctx.drawImage(pt.sprite, -size / 2, -size / 2, size, size);
    pctx.restore();
  }
}

/* =========================================================
   FIELD UPDATE
   ========================================================= */
function updateField(p, t) {
  const camS = cameraScale(p);
  const windStrength = 0.6 + 0.4 * smooth(range(p, 0.55, 0.90));

  for (let i = 0; i < flowers.length; i++) {
    const f = flowers[i];
    const vis = fieldVisibility(p, f.layer);

    let sway = 0;
    if (f.depthFactor > 0.1) {
      sway = Math.sin(t * 0.0007 * f.speed + f.phase) *
             f.amp * f.depthFactor * windStrength;
    }

    const parallax = (1 - camS) * 14 * f.depthFactor;

    f.el.style.transform =
      'translate(-50%, calc(-100% + ' + parallax + 'px)) ' +
      'rotate(' + (f.tilt + sway) + 'deg)';
    f.el.style.opacity = f.alpha * vis;
  }
}

/* =========================================================
   LOOP
   ========================================================= */
let lastT = performance.now();
let time = 0;

function frame(now) {
  const dt = Math.min(now - lastT, 50);
  lastT = now;
  time = now;

  scrollState.smooth += (scrollState.raw - scrollState.smooth) * CONFIG.smoothing;
  if (Math.abs(scrollState.raw - scrollState.smooth) < 0.0002) {
    scrollState.smooth = scrollState.raw;
  }
  const p = scrollState.smooth;

  updateWorldOrientation(p);

  const s = cameraScale(p);
  const y = cameraY(p);
  const x = cameraTranslateX(p);
  cameraEl.style.transform =
    'translate3d(' + x + 'vw, ' + y + 'vh, 0) scale(' + s + ')';

  updateSky(p);
  updateHorizon(p);
  updateTerrain(p);
  updatePlant(p, time);
  updateField(p, time);
  updateRain(dt, p);
  updatePetals(dt, time, p);

  requestAnimationFrame(frame);
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  resizeRain();
  resizePetals();
  buildRain();
  buildPetals();
  readScroll();
  scrollState.smooth = scrollState.raw;
  updateWorldOrientation(scrollState.smooth);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => {
  resizeRain();
  resizePetals();
  readScroll();
}, { passive: true });

init();
</script>
</body>
</html>

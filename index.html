<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WORLD-LAB v0.2.5</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>WORLD-LAB v0.2.5</h1>
    <p id="demo-config"></p>
    <button id="run-wait" type="button">Ejecutar WaitAgent</button>
    <button id="run-random" type="button">Ejecutar RandomAgent</button>
    <p id="execution-status" role="status" aria-live="polite"></p>
    <pre id="summary" aria-label="Resultado experimental"></pre>
    <p id="diagnostic" role="alert" hidden></p>
    <p id="render-status" role="status" hidden></p>
    <canvas id="canvas"></canvas>

    <!-- Orden de carga: core → world → interface → agents → configuration → kernel → recorder → experiment → replay → visualization → main -->
    <script src="js/core/contracts.js"></script>
    <script src="js/core/prng.js"></script>
    <script src="js/core/hash.js"></script>
    <script src="js/core/seed.js"></script>

    <script src="js/world/world_config.js"></script>
    <script src="js/contracts/structures.js"></script>
    <script src="js/world/cells.js"></script>
    <script src="js/world/entity.js"></script>
    <script src="js/world/world_state.js"></script>
    <script src="js/world/world.js"></script>

    <script src="js/interface/action.js"></script>
    <script src="js/interface/action_result.js"></script>
    <script src="js/interface/observation.js"></script>
    <script src="js/interface/feedback.js"></script>

    <script src="js/agents/agent.js"></script>
    <script src="js/agents/wait_agent.js"></script>
    <script src="js/agents/random_agent.js"></script>
    <script src="js/agents/rule_agent.js"></script>
    <script src="js/agents/registry.js"></script>

    <script src="js/experiment/experiment_config.js"></script>
    <script src="js/experiment/trajectory.js"></script>
    <script src="js/experiment/hash_state.js"></script>
    <script src="js/experiment/tick_transaction.js"></script>
    <script src="js/experiment/recorder.js"></script>
    <script src="js/experiment/experiment.js"></script>

    <script src="js/experiment/replay.js"></script>

    <script src="js/visualization/renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
